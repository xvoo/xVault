[package]
name = "xvault"
version = "3.0.0"
edition = "2021"
description = "xVault backend — self-hosted zero-knowledge 2FA & password vault server (Rust)"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
subtle = "2"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
